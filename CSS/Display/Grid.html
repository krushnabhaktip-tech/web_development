<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            display:grid;
            /* Column */
            grid-template-columns:repeat(6,1fr);
                                         /* repeat(no of column , 1fr) */
            gap: 20px;
            background-color:rgb(0, 200, 255);
            padding:20px;                             
        }
        .box{
        background-color: palegoldenrod;
        border: 1px solid black;
        padding: 20px;
        text-align: center;
        font-weight: bold;
    }
    </style>
</head>
<body>
    <div class="product">
        <div class="box">cake .</div>
        <div class="box">Price .</div>
        <div class="box">cookies .</div>
        <div class="box">Price .</div>
        <div class="box">Pastry .</div>
        <div class="box">Price .</div>
    </div>
</body>
</html>
