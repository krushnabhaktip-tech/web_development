<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product{
            display: flex;
            /* FlexBy default provide display in row */
            /* flex-direction: column;  change the display*/ 
            justify-content:center;
            background-color:rgb(240, 140, 158);
            gap: 30px;
            align-items:center;
            height: 300px;
        }
        .box{
            border: 1px  solid black;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            padding:  10px;
            font-weight: bold;
            font-style: italic;
            background-color:beige;
            box-shadow: 0 0 12px black

        } 
               
    </style>
</head>
<body>
    <!-- Fiex Display in 1 dimensional - Row or Colum -->
    <div class="product">
        <div class="box">cake .</div>
        <div class="box">Cookies .</div>
        <div class="box">pastry .</div>
    </div>
</body>
</html>
