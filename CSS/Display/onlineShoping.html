        padding: 10px;
        overflow: hidden;
        box-shadow:0 0 8px black;

    .product img{
        height: 100px;
        width:auto;
        object-fit: cover;
    }
    .product p{
         color: #ccc;
        text-decoration: underline;

    }
    .product h2{

    }
    .product button{
        background-color: rgb(255, 85, 0);
        color: white;
        border: none;
        padding:10px;
        border-radius: 8px;
        cursor: pointer;
    }
