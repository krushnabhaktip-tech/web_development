<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Dog Image</title>
</head>
<body>

    <h1>Random Dog Image</h1>

    <button onclick="fetchDog()">Get Dog Image</button>
    <br><br>

    <img id="dogImage" src="https://images.dog.ceo/breeds/terrier-norwich/n02094258_257.jpg" height="250" width="250" alt="Dog">

    <script>
        function fetchDog() {
            // API માંથી ડેટા લાવવા માટે
            fetch('https://dog.ceo/api/breeds/image/random')
                .then(response => response.json()) // રિસ્પોન્સને JSON માં ફેરવો
                .then(data => {
                    // JSON માંથી 'message' (જે ઈમેજની લિંક છે) તેને src માં સેટ કરો
                    document.getElementById("dogImage").src = data.message;
                })
                .catch(error => {
                    // જો કોઈ ભૂલ આવે તો કન્સોલમાં દેખાશે
                    console.log("Error logic:", error);
                });
        }
    </script>

</body>
</html>
