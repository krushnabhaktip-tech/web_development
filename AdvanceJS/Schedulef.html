<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // setTimeout(function in bracket) - > Time To Function
        // 1000 - 1 sec

        setTimeout(()=>{

            console.log("Hello I am Arrow function")
        },5000)

        // setInterval - Break
        setInterval (()=>{
            console.log("Hey I Will Run After every 2 sec")

        },2000 )
        
    </script>
</body>
</html>
