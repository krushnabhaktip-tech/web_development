<body>
    <script>
        // Switch - Changing through diffrent case

        // vending Machine

        let choice = 4

        switch(choice) {
            // difrent case

            case 1:
                console.log("chips")
                 break;

            case 2:
                console.log("Chocolate")
                 break;

            case 3:
                console.log("Cola")
                 break;
            
            case 4:
                console.log("Coffee")
                break;

            case 5:
                console.log("Destes")
                 break;

            case 6:
                console.log("Biscuit")
                 break;

            case 7:
                console.log("Cake")
                 break;

            default: 
                 console.log("Invalid Choice")    
                    
                    
                    
                



        }
    </script>
