<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Weather App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.8s ease;
            background: #2c3e50; /* Default */
        }

        /* --- Dynamic Backgrounds --- */
        .bg-clear { background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); }
        .bg-clouds { background: linear-gradient(to bottom, #bdc3c7 0%, #2c3e50 100%); }
        .bg-rain { background: linear-gradient(to bottom, #000428 0%, #004e92 100%); }
        .bg-snow { background: linear-gradient(to bottom, #e6e9f0 0%, #eef1f5 100%); }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 35px;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            color: white;
        }

        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 15px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
        }

        button {
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.1); background: #00f2fe; }

        .weather-icon { width: 120px; margin-top: 10px; }
        .temp { font-size: 70px; font-weight: 700; margin: 10px 0; }
        .city { font-size: 30px; opacity: 0.9; }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .loader {
            display: none;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #error { display: none; color: #ff4757; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body class="bg-clouds">

    <div class="container">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city...">
            <button onclick="getWeather()">🔍</button>
        </div>

        <p id="error">City not found! ❌</p>
        <div id="loader" class="loader"></div>

        <div id="weatherContent" style="display: none;">
            <img src="https://openweathermap.org/img/wn/10d@2x.png" id="mainIcon" class="weather-icon" alt="icon">
            <h1 class="temp" id="temp">22°C</h1>
            <h2 class="city" id="cityName">London</h2>
            <p id="desc" style="text-transform: capitalize;">Clear Sky</p>

            <div class="details-grid">
                <div>
                    <p style="font-size: 14px; opacity: 0.7;">Humidity 💧</p>
                    <h3 id="humidity">40%</h3>
                </div>
                <div>
                    <p style="font-size: 14px; opacity: 0.7;">Wind Speed 💨</p>
                    <h3 id="wind">15 km/h</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "863242cfb2b1d357e6093d9a4df19a4b";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        async function getWeather() {
            const city = document.getElementById("cityInput").value;
            const weatherContent = document.getElementById("weatherContent");
            const loader = document.getElementById("loader");
            const error = document.getElementById("error");

            if(!city) return;

            // Start Loading
            loader.style.display = "block";
            weatherContent.style.display = "none";
            error.style.display = "none";

            try {
                const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
                const data = await response.json();

                if(response.status == 404) {
                    error.style.display = "block";
                    loader.style.display = "none";
                } else {
                    // Update Content
                    document.getElementById("cityName").innerHTML = data.name;
                    document.getElementById("temp").innerHTML = Math.round(data.main.temp) + "°C";
                    document.getElementById("desc").innerHTML = data.weather[0].description;
                    document.getElementById("humidity").innerHTML = data.main.humidity + "%";
                    document.getElementById("wind").innerHTML = data.wind.speed + " km/h";
                    
                    // Set Icon
                    const iconCode = data.weather[0].icon;
                    document.getElementById("mainIcon").src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

                    // Update Background based on weather
                    updateBackground(data.weather[0].main);

                    loader.style.display = "none";
                    weatherContent.style.display = "block";
                }
            } catch (err) {
                console.log("Error fetching data");
                loader.style.display = "none";
            }
        }

        function updateBackground(condition) {
            document.body.className = ""; // clear current class
            if(condition === "Clear") document.body.classList.add("bg-clear");
            else if(condition === "Rain" || condition === "Drizzle") document.body.classList.add("bg-rain");
            else if(condition === "Snow") document.body.classList.add("bg-snow");
            else document.body.classList.add("bg-clouds");
        }

        // Enter key support
        document.getElementById("cityInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") getWeather();
        });
    </script>
</body>
</html>
