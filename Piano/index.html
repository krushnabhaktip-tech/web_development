 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Piano</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; }
        .piano { display: flex; gap: 5px; }
        .key { width: 60px; height: 200px; background: white; border: 1px solid #ccc; cursor: pointer; border-radius: 0 0 5px 5px; font-weight: bold; }
        .key:active { background: #ddd; transform: translateY(2px); }
    </style>
</head>
<body>

    <div class="piano">
        <button class="key" onclick="playMusic()">DO</button>
        <button class="key" onclick="playMusic()">RE</button>
        <button class="key" onclick="playMusic()">MI</button>
        <button class="key" onclick="playMusic()">FA</button>
        <button class="key" onclick="playMusic()">SO</button>
    </div>

    <audio id="myAudio" src="domartistudios-magical-wizard-school-orchestral-fantasy-488126.mp3"></audio>

    <script>
        function playMusic() {
            var audio = document.getElementById("myAudio");
            audio.currentTime = 0; // દર વખતે ક્લિક કરો ત્યારે શરૂઆતથી વાગશે
            audio.play().catch(function(error) {
                console.log("Audio Error: " + error);
                alert("બ્રાઉઝરમાં અવાજ પ્લે કરવાની પરમિશન આપો.");
            });
        }
    </script>
</body>
</html>
